# Explanations for reports/agreement-S004.md (rendered by `rrs ledger agree`). A is the ledger of
# record as compared (ledger/agreement/S004.a.jsonl: after the verification amendments, before
# the agreement fixes); B is the independent extraction by a fresh subagent that saw only the
# guide, the accepted rules and the chunks.
ATS-3: >-
  A F!, B F on "you'd need the ATS to filter anybody that wasn't SC eligible". Vague guidance on
  whether automatic filtering counts as rejecting. Guide now: F! includes automatic filtering out in
  the recruiter's own process. A stands.
STR-1: >-
  "The first one I would definitely say is length" (the biggest mistakes the recruiter sees): A F,
  B P. Guide now: naming the mistakes the recruiter sees is F. A stands.
STR-3: >-
  Same pattern as STR-1 (poor presentation, the second biggest mistake). A stands.
ACH-1: >-
  Same pattern (JB-17, the third biggest mistake, F in A; B folded it into a P claim). A stands.
REG-2: >-
  "If you put it on your CV it gives people a reason to click past": A F (F! before verification),
  B P (folded into the advice). Guide now: a reason attached to advice stays P unless reported as
  something screeners do. A amended (JB-38 to P).
CHN-2: >-
  A typed "there's nothing worse than coming across a LinkedIn profile..." as part of a P claim; B
  made it F, and B alone caught "if you're searchable and accessible online that makes you much
  more approachable" (F). Guide now: the recruiter's reactions are F, and mixed sentences split.
  A amended (JB-44 split, JB-47 and JB-48 added).
CHN-3: >-
  "A cover letter that probably wouldn't get read": A folded it into a P claim (JB-32), B made it
  an F claim. Guide now: reading behavior is F. A amended (JB-32 split, JB-46 added).
B-NEW-1: >-
  Domain and end customers under each role (S004.t0022.s004). A mapped the quote to ACH-1, whose
  text does not state it; under ADR 0003 that is an indirect mapping, so B is right. Proposed as
  NEW-24 in ledger/staging/S004.new-rules.yaml for the owner.
B-NEW-2: >-
  "Have someone in the industry review your CV" (S004.t0026.s006). A skipped it on purpose: no X-
  rule covers CV process advice, and the owner agreed to skip it (2026-10-19). No change.
B-NEW-3: >-
  About 70 percent of early placements came from referrals. A recorded it as an F claim on CHN-1
  (JB-28); B made it a measure, which is what the guide says for stated numbers. Proposed as NEW-25
  for the owner; if accepted, JB-28 moves to it.
_summary: >-
  Rule coverage passed the target in both directions (A found by B 1.00, B found by A 0.90),
  and stances agreed on every matched rule. Type agreement was the weak point (0.73). All eight
  type differences came from three gaps in the guide's typing section: whether naming the mistakes
  one sees, reading behavior and reactions are facts; whether a reason attached to advice is a
  separate fact; and whether automatic filtering counts as rejecting. The guide now answers each,
  and the ledger was amended to match. B's two extra rules were real gaps under ADR 0003 and are
  proposed to the owner; the third was a deliberate skip.
