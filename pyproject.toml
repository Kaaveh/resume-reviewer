[project]
name = "rrs"
version = "0.1.0"
description = "Resume Review Skills: corpus, claims ledger and the resume-reviewer skill"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "pydantic>=2.9",
    "pysbd>=0.3.4",
    "pyyaml>=6.0",
    "rapidfuzz>=3.10",
    "typer>=0.12",
]

[project.scripts]
rrs = "rrs.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rrs"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]

[tool.ruff.lint.isort]
known-first-party = ["rrs"]
known-local-folder = ["helpers", "conftest"]
